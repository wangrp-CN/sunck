global:
  scrape_interval: 15s
scrape_configs:
  - job_name: rail_monitor
    # 原生部署：直连本地后端 /metrics（不依赖 Docker）
    static_configs:
      - targets: ['127.0.0.1:8000']
  - job_name: pushgateway
    # 压测常态化：scripts/stress_test.py 运行后把 rail_monitor_stress_* 推到 pushgateway。
    # honor_labels 保证推送时自带的 run_ts/env 标签不被 job/instance 覆盖。
    honor_labels: true
    static_configs:
      - targets: ['127.0.0.1:9091']
