# 视频 AI 参考推理服务（⑧）独立 compose
# 用法：docker compose -f deploy/docker-compose.video-ai.yml up -d --build
services:
  video-ai:
    build:
      context: ..
      dockerfile: services/video_ai/Dockerfile
    image: rail-video-ai:latest
    container_name: rail-video-ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:8900:8900"
    environment:
      - VIDEO_AI_PORT=8900
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8900/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
